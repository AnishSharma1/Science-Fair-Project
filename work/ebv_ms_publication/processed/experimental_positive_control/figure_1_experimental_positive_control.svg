<circle cx="575.0" cy="315.0" r="5" fill="#e66a2c"/><text x="583.0" y="319.0" class="res">7:I</text>
<text x="560" y="560" class="small">Each grey connector joins structurally aligned core positions.</text>
<text x="45" y="625" class="small">Sources: Lang et al., Nat. Immunol. 2002; RCSB PDB 1H15 and 1BX2.</text></svg>